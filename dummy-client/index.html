<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>API Rate Limiter - Multi-Company Test Client</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #0f1115; color: #e5e7eb; max-width: 720px; margin: 30px auto; padding: 0 16px; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: #9ca3af; font-size: 13px; margin-bottom: 20px; }
  .box { background: #18181b; border: 1px solid #27272a; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  label { font-size: 12px; color: #9ca3af; display: block; margin-bottom: 4px; }
  .row { display: flex; gap: 12px; align-items: flex-end; margin-bottom: 12px; }
  .row:last-child { margin-bottom: 0; }
  input, select { background: #09090b; border: 1px solid #27272a; color: #e5e7eb; padding: 8px 10px; border-radius: 6px; font-size: 13px; width: 100%; box-sizing: border-box; }
  input:focus, select:focus { outline: none; border-color: #3b82f6; }
  .buttons { display: flex; gap: 10px; flex-wrap: wrap; }
  button { background: #3b82f6; color: white; border: none; padding: 9px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: background 0.15s; }
  button:hover { background: #2563eb; }
  button.secondary { background: transparent; border: 1px solid #27272a; color: #e5e7eb; }
  button.secondary:hover { background: #27272a; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #log { background: #09090b; border: 1px solid #27272a; border-radius: 6px; padding: 10px; height: 260px; overflow-y: auto; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; white-space: pre-wrap; }
  .ok { color: #4ade80; }
  .fail { color: #f87171; }
  .warning { color: #facc15; }
  .info { color: #60a5fa; }
  .stats { display: flex; gap: 14px; margin-bottom: 12px; }
  .stat { flex: 1; background: #09090b; border-radius: 8px; padding: 12px; text-align: center; border: 1px solid #27272a; }
  .stat .num { font-size: 24px; font-weight: bold; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 6px; border-radius: 4px; background: #27272a; color: #9ca3af; margin-left: 6px; }
</style>
</head>
<body>

  <h1>Dummy Website (Multi-Company Simulator)</h1>
  <div class="subtitle">Simulate real-time traffic and true instantaneous burst concurrency across different SaaS tenant companies.</div>

  <div class="box">
    <div class="row">
      <div style="flex: 2;">
        <label>Rate Limiter Backend URL</label>
        <input id="backendUrl" value="http://localhost:8000" />
      </div>
      <div style="flex: 3;">
        <label>Company API Key (required; copy from your dashboard)</label>
        <input id="apiKey" type="password" placeholder="Paste the Simulator API key shown on your dashboard" />
      </div>
    </div>

    <div class="row">
      <div style="flex: 1;">
        <label>HTTP Method</label>
        <select id="method">
          <option value="GET">GET</option>
          <option value="POST">POST</option>
          <option value="PUT">PUT</option>
          <option value="DELETE">DELETE</option>
        </select>
      </div>
      <div style="flex: 3;">
        <label>API Endpoint Path (Select preset or type any custom route)</label>
        <input id="endpointInput" value="/demo/books" placeholder="/demo/books or /demo/login or custom path" list="presetEndpoints" />
        <datalist id="presetEndpoints">
          <option value="/demo/books">GET /demo/books</option>
          <option value="/demo/login">POST /demo/login</option>
          <option value="/demo/orders">POST /demo/orders</option>
        </datalist>
      </div>
      <div style="flex: 1.5;">
        <label>Burst Amount</label>
        <select id="burstCount">
          <option value="5">5 Requests</option>
          <option value="10" selected>10 Requests</option>
          <option value="20">20 Requests</option>
          <option value="50">50 Requests</option>
        </select>
      </div>
    </div>
    <div id="policySyncStatus" class="subtitle">Enter the company API key to sync enabled policies and their methods.</div>
  </div>

  <div class="box">
    <div class="buttons">
      <button id="btnSingle" onclick="sendOne()">Send 1 Request</button>
      <button id="btnBurst" onclick="sendTrueBurst()">Send True Concurrent Burst 🚀</button>
      <button class="secondary" onclick="clearLog()">Clear Stats & Logs</button>
    </div>
  </div>

  <div class="box">
    <div class="stats">
      <div class="stat"><div class="num" id="totalNum">0</div>Total Sent</div>
      <div class="stat"><div class="num ok" id="okNum">0</div>Allowed (200)</div>
      <div class="stat"><div class="num fail" id="failNum">0</div>Rejected (429)</div>
      <div class="stat"><div class="num warning" id="errorNum">0</div>Errors / Timeouts</div>
    </div>
    <div id="log"></div>
  </div>

<script>
  let total = 0, ok = 0, fail = 0, errors = 0;
  let simulatorPolicies = [];
  let isSyncingPolicies = false;

  function log(msg, cls, timestamp = new Date(), parent = document.getElementById("log")) {
    const line = document.createElement("div");
    if (cls) line.className = cls;
    line.textContent = `[${timestamp.toLocaleTimeString()}] ${msg}`;
    parent.appendChild(line);
    const box = document.getElementById("log");
    box.scrollTop = box.scrollHeight;
  }

  function updateStats() {
    document.getElementById("totalNum").textContent = total;
    document.getElementById("okNum").textContent = ok;
    document.getElementById("failNum").textContent = fail;
    document.getElementById("errorNum").textContent = errors;
  }

  function syncMethodForEndpoint() {
    const endpoint = document.getElementById("endpointInput").value.trim();
    const methodInput = document.getElementById("method");
    if (endpoint.replace(/\/$/, "") === "/demo/login") {
      methodInput.value = "POST";
      methodInput.disabled = true;
      return;
    }
    methodInput.disabled = false;
    const policy =
      simulatorPolicies.find((item) => item.endpoint === endpoint && item.method !== "*") ||
      simulatorPolicies.find(
        (item) => item.endpoint.endsWith("*") && endpoint.startsWith(item.endpoint.slice(0, -1)) && item.method !== "*",
      );
    if (policy) document.getElementById("method").value = policy.method;
  }

  async function refreshSimulatorPolicies() {
    if (isSyncingPolicies) return;
    const backendUrl = document.getElementById("backendUrl").value.trim().replace(/\/$/, "");
    const apiKey = document.getElementById("apiKey").value.trim();
    const status = document.getElementById("policySyncStatus");
    if (!backendUrl || !apiKey) {
      simulatorPolicies = [];
      status.textContent = "Enter the company API key to sync enabled policies and their methods.";
      return;
    }

    isSyncingPolicies = true;
    try {
      const response = await fetch(`${backendUrl}/simulator/policies`, {
        headers: { "X-Company-Key": apiKey },
      });
      if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        throw new Error(data.detail || `Request failed (${response.status})`);
      }
      simulatorPolicies = await response.json();
      syncMethodForEndpoint();
      status.textContent = `Synced ${simulatorPolicies.length} enabled policies. Matching endpoint methods update automatically.`;
    } catch (err) {
      simulatorPolicies = [];
      status.textContent = `Policy sync failed: ${err.message}`;
    } finally {
      isSyncingPolicies = false;
    }
  }

  function getBody(endpoint, method) {
    if (method === "GET") return null;
    if (endpoint === "/demo/login") return { username: "demo", password: "demo123" };
    if (endpoint === "/demo/orders") return { book_id: 1, quantity: 1 };
    return { test: true, timestamp: Date.now() };
  }

  function completeRequest(result, deferLog, logTarget) {
    if (result.type === "allowed") ok++;
    else if (result.type === "rejected") fail++;
    else errors++;
    updateStats();
    if (!deferLog) log(result.message, result.className, new Date(), logTarget);
    return result;
  }

  async function executeSingleRequest({ backendUrl, endpoint, method, apiKey, deferLog = false, logTarget } = {}) {
    backendUrl = backendUrl || document.getElementById("backendUrl").value.replace(/\/$/, "");
    endpoint = endpoint || document.getElementById("endpointInput").value.trim() || "/demo/books";
    method = method || document.getElementById("method").value;
    if (apiKey === undefined) {
      apiKey = document.getElementById("apiKey").value.trim();
    }
    const body = getBody(endpoint, method);

    if (!apiKey) {
      return completeRequest({
        message: "Enter your company API key from the dashboard to send requests for that company.",
        className: "warning",
        type: "error",
      }, deferLog, logTarget);
    }

    const headers = {};
    if (body) headers["Content-Type"] = "application/json";
    headers["X-Company-Key"] = apiKey;

    total++;
    updateStats();
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 10000);
    try {
      const res = await fetch(backendUrl + endpoint, {
        method,
        headers,
        body: body ? JSON.stringify(body) : undefined,
        signal: controller.signal,
      });

      if (res.status === 429) {
        const data = await res.json().catch(() => ({}));
        const policyName = data.policy ? ` (${data.policy})` : "";
        return completeRequest({
          message: `${method} ${endpoint} -> 429 Too Many Requests${policyName}`,
          className: "fail",
          type: "rejected",
        }, deferLog, logTarget);
      }
      if (res.ok) {
        return completeRequest({
          message: `${method} ${endpoint} -> ${res.status} OK`,
          className: "ok",
          type: "allowed",
        }, deferLog, logTarget);
      }

      const data = await res.json().catch(() => ({}));
      return completeRequest({
        message: `${method} ${endpoint} -> ${res.status} ${data.detail || res.statusText}`,
        className: "warning",
        type: "error",
      }, deferLog, logTarget);
    } catch (err) {
      const message = err.name === "AbortError"
        ? `${method} ${endpoint} -> Request timed out after 10 seconds`
        : `${method} ${endpoint} -> Network Error: ${err.message}`;
      return completeRequest({ message, className: "warning", type: "error" }, deferLog, logTarget);
    } finally {
      clearTimeout(timeoutId);
    }
  }

  async function sendOne() {
    await executeSingleRequest();
  }

  // Launch every request in the burst concurrently without adding delays.
  function sendTrueBurst() {
    const count = parseInt(document.getElementById("burstCount").value, 10) || 10;
    const endpoint = document.getElementById("endpointInput").value.trim() || "/demo/books";
    const method = document.getElementById("method").value;
    const backendUrl = document.getElementById("backendUrl").value.replace(/\/$/, "");
    const apiKey = document.getElementById("apiKey").value.trim();
    const timestamp = new Date();
    const group = document.createElement("div");
    document.getElementById("log").appendChild(group);

    const requests = Array.from({ length: count }, () =>
      executeSingleRequest({ backendUrl, endpoint, method, apiKey, deferLog: true })
    );
    log(`>>> Firing ${count} simultaneous requests concurrently at ${endpoint} ...`, "info", timestamp, group);

    requests.forEach((request) => {
      void request.then((result) => log(result.message, result.className, timestamp, group));
    });
  }

  function clearLog() {
    document.getElementById("log").innerHTML = "";
    total = ok = fail = errors = 0;
    updateStats();
  }

  document.getElementById("endpointInput").addEventListener("input", syncMethodForEndpoint);
  document.getElementById("apiKey").addEventListener("change", refreshSimulatorPolicies);
  document.getElementById("backendUrl").addEventListener("change", refreshSimulatorPolicies);
  refreshSimulatorPolicies();
  setInterval(refreshSimulatorPolicies, 2000);
</script>
</body>
</html>
